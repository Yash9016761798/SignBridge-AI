# Training Configuration for SignBridge AI

# =============================================================================
# GENERAL
# =============================================================================

general:
  experiment_name: 'isl_gesture_baseline'
  seed: 42
  output_dir: './models'
  log_dir: './models/logs'
  checkpoint_dir: './models/checkpoints'
  save_every_n_epochs: 5
  early_stopping_patience: 10
  verbose: true

# =============================================================================
# DEVICE
# =============================================================================

device:
  # Options: "cuda" | "cpu" | "mps" | "auto"
  type: 'auto'

  # Multi-GPU settings
  distributed: false
  num_gpus: 1

# =============================================================================
# DATA LOADER
# =============================================================================

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: true
  shuffle_train: true
  shuffle_val: false

# =============================================================================
# MODEL
# =============================================================================

model:
  # Options: "lstm" | "transformer" | "cnn_lstm" | "graph_nn"
  architecture: 'lstm'

  # Input dimensions
  input_dim: 252 # Total landmark features per frame
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  bidirectional: true

  # For transformer
  num_heads: 8
  ff_dim: 256
  max_seq_length: 30

  # For CNN-LSTM
  cnn_backbone: 'resnet18'
  cnn_pretrained: true

  # For Graph NN
  graph_num_nodes: 543 # MediaPipe total landmarks
  graph_edge_dim: 64

  # Classification head
  num_classes: 35
  classifier_hidden: [128, 64]

# =============================================================================
# OPTIMIZER
# =============================================================================

optimizer:
  # Options: "adam" | "adamw" | "sgd" | "rmsprop"
  type: 'adamw'
  learning_rate: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  momentum: 0.9 # for SGD

# =============================================================================
# SCHEDULER
# =============================================================================

scheduler:
  # Options: "cosine" | "step" | "plateau" | "none"
  type: 'cosine'
  T_max: 50
  eta_min: 0.00001
  step_size: 10
  gamma: 0.1
  patience: 5
  factor: 0.5

# =============================================================================
# LOSS
# =============================================================================

loss:
  # Options: "cross_entropy" | "focal" | "label_smoothing"
  type: 'cross_entropy'
  label_smoothing: 0.1
  focal_alpha: 2.0
  focal_gamma: 2.0

# =============================================================================
# TRAINING
# =============================================================================

training:
  epochs: 50
  gradient_clip_norm: 1.0
  mixed_precision: true # AMP
  gradient_accumulation_steps: 1

  # Validation
  validate_every_n_epochs: 1

  # Checkpointing
  save_best_only: true
  monitor_metric: 'val_accuracy'
  monitor_mode: 'max'

# =============================================================================
# LOGGING
# =============================================================================

logging:
  # Options: "tensorboard" | "wandb" | "none"
  backend: 'tensorboard'
  wandb_project: 'signbridge-ai'
  wandb_entity: ''
  log_predictions: true
  log_confusion_matrix: true
  log_lr_scheduler: true
  log_grad_norm: false

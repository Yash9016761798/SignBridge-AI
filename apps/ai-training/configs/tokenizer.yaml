# Tokenizer Configuration for SignBridge AI
# NLP Pipeline for Indian Sign Language Translation

# =============================================================================
# NORMALIZATION
# =============================================================================

normalization:
  # Convert text to lowercase
  lowercase: true

  # Strip leading/trailing whitespace
  strip_whitespace: true

  # Collapse multiple whitespace to single space
  collapse_whitespace: true

  # Remove all punctuation
  remove_punctuation: false

  # Keep sentence-ending punctuation (., !, ?)
  keep_sentence_punctuation: true

  # Remove numbers
  remove_numbers: false

  # Normalize unicode characters
  normalize_unicode: true

  # Remove accents/diacritics
  remove_accents: false

# =============================================================================
# TOKENIZATION
# =============================================================================

tokenization:
  # Add BOS (beginning of sequence) token
  add_bos: true

  # Add EOS (end of sequence) token
  add_eos: true

  # Split text by whitespace (word-level tokenization)
  split_by_whitespace: true

# =============================================================================
# SEQUENCE
# =============================================================================

sequence:
  # Maximum sequence length (tokens)
  max_length: 50

  # Padding direction: 'pre' or 'post'
  padding: 'post'

  # Truncation direction: 'pre' or 'post'
  truncation: 'post'

# =============================================================================
# SPECIAL TOKENS
# =============================================================================

special_tokens:
  pad: '<pad>'
  bos: '<bos>'
  eos: '<eos>'
  unk: '<unk>'

  # Token IDs (must match vocabulary)
  pad_id: 0
  bos_id: 1
  eos_id: 2
  unk_id: 3

# Dataset Paths Configuration
# SignBridge AI — Google Colab / Google Drive

# =============================================================================
# GOOGLE DRIVE ROOT
# =============================================================================
drive:
  root: /content/drive/MyDrive/SignBridgeAI
  dataset: /content/drive/MyDrive/SignBridgeAI/dataset
  checkpoints: /content/drive/MyDrive/SignBridgeAI/checkpoints
  logs: /content/drive/MyDrive/SignBridgeAI/logs
  exports: /content/drive/MyDrive/SignBridgeAI/exports
  tensorboard: /content/drive/MyDrive/SignBridgeAI/tensorboard
  experiments: /content/drive/MyDrive/SignBridgeAI/experiments

# =============================================================================
# HUGGING FACE
# =============================================================================
huggingface:
  repo_id: Exploration-Lab/iSign
  csv_filename: iSign_v1.1.csv
  # Video archives (split into multiple parts)
  video_archives:
    - data/video/video.mp4.part1.rar
    - data/video/video.mp4.part2.rar
    - data/video/video.mp4.part3.rar
    - data/video/video.mp4.part4.rar
    - data/video/video.mp4.part5.rar
    - data/video/video.mp4.part6.rar
  # Pose archives (split into multiple parts)
  pose_archives:
    - data/pose/pose.mp4.part1.rar
    - data/pose/pose.mp4.part2.rar
    - data/pose/pose.mp4.part3.rar
    - data/pose/pose.mp4.part4.rar
    - data/pose/pose.mp4.part5.rar
    - data/pose/pose.mp4.part6.rar
    - data/pose/pose.mp4.part7.rar
    - data/pose/pose.mp4.part8.rar
    - data/pose/pose.mp4.part9.rar
    - data/pose/pose.mp4.part10.rar
    - data/pose/pose.mp4.part11.rar
    - data/pose/pose.mp4.part12.rar

# =============================================================================
# LOCAL PATHS (after download)
# =============================================================================
local:
  csv_path: './datasets/iSign_v1.1.csv'
  video_dir: './datasets/videos'
  pose_dir: './datasets/poses'
  cache_dir: './datasets/cache'
  index_path: './datasets/cache/dataset_index.json'

# =============================================================================
# ARCHIVE EXTRACTION
# =============================================================================
extraction:
  video_output: './datasets/videos'
  pose_output: './datasets/poses'
  temp_dir: './datasets/tmp'
  chunk_size: 8192

# =============================================================================
# VERIFICATION
# =============================================================================
verification:
  check_csv: true
  check_poses: true
  check_videos: false
  max_missing: 100
  max_corrupt: 10

# =============================================================================
# DATASET INFO (from prior analysis)
# =============================================================================
info:
  total_rows: 127237
  unique_videos: 6058
  vocab_size: 68241
  csv_columns: [uid, text]
  description: 'Indian Sign Language to English text translation'

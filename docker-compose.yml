version: '3.8'

services:
  # ============================================================
  # SignBridge AI - Inference Service
  # FastAPI + PyTorch PoseTransformer
  # ============================================================
  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
      args:
        - PYTHON_VERSION=3.11
    container_name: signbridge-ai
    restart: unless-stopped
    ports:
      - '${AI_PORT:-8000}:8000'
    environment:
      - SIGNBRIDGE_HOST=0.0.0.0
      - SIGNBRIDGE_PORT=8000
      - SIGNBRIDGE_DEBUG=${SIGNBRIDGE_DEBUG:-false}
      - SIGNBRIDGE_LOG_LEVEL=${SIGNBRIDGE_LOG_LEVEL:-INFO}
      - SIGNBRIDGE_MODEL_CHECKPOINT=${MODEL_CHECKPOINT:-experiments/representative/checkpoints/best.pt}
      - SIGNBRIDGE_VOCAB_PATH=${VOCAB_PATH:-experiments/representative/vocabulary.json}
      - SIGNBRIDGE_MODEL_VERSION=${MODEL_VERSION:-1.0.0}
      - SIGNBRIDGE_CORS_ORIGINS=http://localhost:${WEB_PORT:-3000},http://localhost:3000
      - SIGNBRIDGE_NUM_LANDMARKS=33
      - SIGNBRIDGE_NUM_FEATURES=5
      - SIGNBRIDGE_MAX_SEQ_LENGTH=30
      - SIGNBRIDGE_DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - ./ai-training/experiments:/app/ai-training/experiments:ro
      - ./ai-training/checkpoints:/app/ai-training/checkpoints:ro
      - ./ai-training/tokenizer:/app/ai-training/tokenizer:ro
      - ./ai-training/models:/app/ai-training/models:ro
      - ./logs/ai-service:/app/logs
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - signbridge-network

  # ============================================================
  # SignBridge Web - Next.js Frontend
  # ============================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NODE_VERSION=18
    container_name: signbridge-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:${AI_PORT:-8000}
      - NEXT_PUBLIC_APP_NAME=SignBridge AI
      - NEXT_PUBLIC_APP_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - signbridge-network

volumes:
  ai-logs:

networks:
  signbridge-network:
    driver: bridge

# Training Engine Configuration
# SignBridge AI

# =============================================================================
# GENERAL
# =============================================================================
seed: 42
max_epochs: 100
batch_size: 16
steps_per_epoch: 1000

# =============================================================================
# MODEL
# =============================================================================
vocab_size: 35000
pad_token_id: 0
d_model: 512

# =============================================================================
# OPTIMIZER
# =============================================================================
optimizer: adamw
learning_rate: 0.0001
weight_decay: 0.0001
betas: [0.9, 0.999]
eps: 1.0e-8

# =============================================================================
# SCHEDULER
# =============================================================================
scheduler: cosineannealing
eta_min: 1.0e-6

# =============================================================================
# TRAINING
# =============================================================================
gradient_clip: 1.0
label_smoothing: 0.1
mixed_precision: false

# =============================================================================
# CHECKPOINTING
# =============================================================================
checkpoint_interval: 1
checkpoint_dir: ./checkpoints
save_dir: ./experiments

# =============================================================================
# LOGGING
# =============================================================================
log_interval: 10
log_dir: ./logs

# =============================================================================
# EARLY STOPPING
# =============================================================================
patience: 10
min_delta: 0.001
monitor: val_loss
mode: min

# =============================================================================
# CALLBACKS
# =============================================================================
callbacks:
  - checkpoint
  - early_stopping
  - lr_monitor
  - progress_bar
  - logger

representative_dataset:
  source_csv: "datasets/iSign_v1.1.csv"
  output_dir: "datasets/representative"
  seed: 42

  target_size: 200
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1

  stratification:
    primary: "sentence_length"
    secondary: "word_count"

  sentence_length_bins:
    - [1, 5]
    - [6, 10]
    - [11, 15]
    - [16, 20]
    - [21, 50]

  min_samples_per_bin: 100
  max_samples_per_bin: 5000
  fallback_strategy: "uniform"

  analysis:
    analyze_vocabulary: true
    analyze_word_frequency: true
    analyze_sentence_distribution: true
    generate_plots: true

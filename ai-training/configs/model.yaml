# Model Configuration
# SignBridge AI — Pose Transformer

# =============================================================================
# VOCABULARY
# =============================================================================
vocab:
  vocab_size: 35000
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3

# =============================================================================
# POSE INPUT
# =============================================================================
pose:
  num_landmarks: 33
  num_features: 5
  max_length: 64

# =============================================================================
# TEXT INPUT
# =============================================================================
text:
  max_length: 50
  vocab_size: 35000

# =============================================================================
# MODEL DIMENSIONS
# =============================================================================
model:
  d_model: 512
  num_heads: 8
  d_ff: 2048
  dropout: 0.1

# =============================================================================
# ENCODER
# =============================================================================
encoder:
  num_layers: 6

# =============================================================================
# DECODER
# =============================================================================
decoder:
  num_layers: 6

# =============================================================================
# LOSS
# =============================================================================
loss:
  label_smoothing: 0.1
  pad_token_id: 0

# =============================================================================
# GENERATION
# =============================================================================
generation:
  max_length: 50
  temperature: 1.0
  top_k: 0

# =============================================================================
# TRAINING
# =============================================================================
training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_steps: 4000
  max_epochs: 100
  gradient_clip: 1.0
  seed: 42
